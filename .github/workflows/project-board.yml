name: Project board automation

# New or reopened issue -> Todo
# PR opened that mentions "Closes #N" (or Fixes/Resolves/Refs) -> issue In Progress
# PR merged or issue closed -> Done
on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ github.repository_owner }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - name: Move issue
        if: github.event_name == 'issues'
        env:
          ACTION: ${{ github.event.action }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          if [ "$ACTION" = "closed" ]; then status="Done"; else status="Todo"; fi
          .github/scripts/set-status.sh "$ISSUE_URL" "$status"

      - name: Move PR and linked issues
        if: github.event_name == 'pull_request'
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" != "true" ]; then
              echo "PR closed without merge, nothing to move"
              exit 0
            fi
            status="Done"
          else
            status="In Progress"
          fi

          issues=$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)

          for n in $issues; do
            .github/scripts/set-status.sh "https://github.com/$REPO/issues/$n" "$status"
          done
          .github/scripts/set-status.sh "$PR_URL" "$status"
